<!doctype html>
<html><head><meta charset="utf-8"><title>Collab Digest explainer v3</title>
<style>
@font-face{font-family:Sora;font-weight:400;src:url(fonts/sora-latin-400-normal.woff2)}
@font-face{font-family:Sora;font-weight:600;src:url(fonts/sora-latin-600-normal.woff2)}
@font-face{font-family:Sora;font-weight:700;src:url(fonts/sora-latin-700-normal.woff2)}
@font-face{font-family:Sora;font-weight:800;src:url(fonts/sora-latin-800-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:400;src:url(fonts/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:500;src:url(fonts/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:700;src:url(fonts/dm-sans-latin-700-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
:root{--ink:#070A16;--deck:#0E1326;--deck2:#151B33;--line:#232B4A;--text:#E9ECF8;--muted:#8C93B4;--violet:#7C5CFC;--crystal:#5CC8FF;--lume:#3FE0A4;--gold:#E8B85C;--danger:#FF5C7A;--orange:#F59E3B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--text);font-family:"DM Sans",sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink)}
.disp{font-family:Sora,sans-serif}
.mono{font-family:"JetBrains Mono",monospace}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.gt{background:linear-gradient(90deg,var(--crystal),var(--violet) 55%,var(--lume));-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:linear-gradient(180deg,rgba(27,34,64,.88),rgba(14,19,38,.88));border:1px solid rgba(255,255,255,.09);border-radius:30px;box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.abs{position:absolute}
.eb{font:600 22px Sora;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.c{display:inline-block;opacity:0}
.wd{display:inline-block;white-space:nowrap}
.pill{display:inline-block;font:700 20px "DM Sans";padding:8px 18px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:12px;font:600 24px "DM Sans";padding:12px 22px;border-radius:999px;background:var(--deck2);border:1px solid var(--line);color:var(--muted)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.chip b{color:var(--text)}
.row{position:relative;display:grid;align-items:center;gap:16px;padding:20px 26px 20px 32px;border-radius:20px;background:linear-gradient(180deg,rgba(27,34,64,.9),rgba(14,19,38,.9));border:1px solid rgba(255,255,255,.08);overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c);box-shadow:0 0 22px var(--c)}
.nm{font:700 22px "JetBrains Mono"}
.cr{font:500 17px "DM Sans";color:var(--muted);margin-top:4px}
.dl{font:700 20px "DM Sans"}.dl small{display:block;font:500 15px "DM Sans";color:var(--muted)}
.ring{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 24px rgba(124,92,252,.9),0 0 8px #fff inset;opacity:0;z-index:70;pointer-events:none}
.ring::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff}
.rip{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--crystal);opacity:0;z-index:69;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 24px "DM Sans";padding:18px 34px;border-radius:16px;background:linear-gradient(135deg,var(--violet),#5B3FE0);color:#fff;box-shadow:0 12px 36px rgba(124,92,252,.45)}
.btn.ok{background:linear-gradient(135deg,#12A374,var(--lume));color:#06281e;box-shadow:0 12px 36px rgba(63,224,164,.4)}
.btn.ghost{background:var(--deck2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:700 20px Sora;color:#fff;background:linear-gradient(135deg,var(--violet),var(--crystal));flex:none}
#cap{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;z-index:80;pointer-events:none}
#capin{display:inline-block;max-width:1500px;text-align:center;font:600 42px/1.25 Sora;letter-spacing:-.01em;padding:20px 40px;border-radius:26px;background:rgba(7,10,22,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(0,0,0,.5)}
#capin .cw{color:#B7BDDA}
#capin .cw.on{color:#fff;text-shadow:0 0 22px rgba(92,200,255,.9)}
#capin .cw.done{color:#fff}
</style></head><body>
<div id="stage"></div>
<script>
const TL=window.TL||{total:75,lines:[]};
const L={};TL.lines.forEach(l=>L[l.id]=l);
const T=TL.total;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const r=(f,a,b)=>ease((f-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const stage=document.getElementById("stage");
const $=(s,e)=>(e||document).querySelector(s),$$=(s,e)=>[...(e||document).querySelectorAll(s)];
const BOLT='<svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>';

// ---------- persistent background ----------
const bg=document.createElement("div");
bg.style.cssText="position:absolute;inset:0";
bg.innerHTML=`<div id="o1" class="abs" style="width:1500px;height:1500px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,92,252,.34),transparent)"></div>
<div id="o2" class="abs" style="width:1400px;height:1400px;border-radius:50%;background:radial-gradient(closest-side,rgba(92,200,255,.20),transparent)"></div>
<div id="o3" class="abs" style="width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(63,224,164,.12),transparent)"></div>
<div class="abs" style="inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)"></div>
<div class="abs" style="inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))"></div>`;
stage.appendChild(bg);
function moveBg(t){const o1=$("#o1"),o2=$("#o2"),o3=$("#o3");
 o1.style.transform=`translate(${1100+Math.sin(t*.25)*160}px,${-650+Math.cos(t*.2)*110}px)`;
 o2.style.transform=`translate(${-650+Math.cos(t*.22)*140}px,${450+Math.sin(t*.3)*120}px)`;
 o3.style.transform=`translate(${1000+Math.sin(t*.18+2)*120}px,${700+Math.cos(t*.27)*80}px)`;}

// ---------- helpers ----------
function chars(html){ // wrap letters in .c (grouped per word so lines only break between words); .gt becomes per-letter gradient (.gtc)
  html=html.replace(/class="gt"/g,'class="gtc"');
  let out="",inTag=false,open=false;
  for(const ch of html){
    if(ch==="<"){if(open){out+="</span>";open=false}inTag=true}
    if(inTag){out+=ch;if(ch===">")inTag=false;continue}
    if(ch===" "){if(open){out+="</span>";open=false}out+=" ";continue}
    if(!open){out+='<span class="wd">';open=true}
    out+=`<span class="c">${ch}</span>`}
  if(open)out+="</span>";return out}
const GS=[[92,200,255],[124,92,252],[63,224,164]];
function gradAt(p){const k=p<.55?0:1,q=k?(p-.55)/.45:p/.55;const a=GS[k],b=GS[k+1];return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*q)).join(",")})`}
function gradChars(root){$$(".gtc",root).forEach(g=>{const cs=$$(".c",g);cs.forEach((c,i)=>{c.style.color=gradAt(cs.length>1?i/(cs.length-1):0);c.style.textShadow="0 0 40px rgba(124,92,252,.35)"})})}
function revealChars(el,f,a,b){const cs=$$(".c",el);cs.forEach((c,i)=>{const s=a+(b-a)*i/Math.max(1,cs.length);const p=r(f,s,s+.1*(b-a)+.001);c.style.opacity=p;c.style.transform=`translateY(${(1-p)*40}px) scale(${.92+.08*p})`;c.style.filter=p<1?`blur(${(1-p)*8}px)`:"none"})}
function pop(el,f,a,b,dy=40){const p=r(f,a,b);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px) scale(${.96+.04*p})`;return p}
function counter(el,f,a,b){const p=r(f,a,b);el.textContent=Math.round(+el.dataset.n*p)+(el.dataset.suf||"")}
const ring=document.createElement("div");ring.className="ring";const rip=document.createElement("div");rip.className="rip";
const ev=v=>typeof v==="function"?v():v;
const C=(el,dx=0,dy=0)=>()=>{const b=el.getBoundingClientRect();return[b.left+b.width*.5+dx,b.top+b.height*.5+dy]};
function setCursor(f,pts){let[x,y]=ev(pts[0][1]);
 for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(f>=a[0]&&f<=b[0]){const p=eio((f-a[0])/(b[0]-a[0]));const A=ev(a[1]),B=ev(b[1]);x=lerp(A[0],B[0],p);y=lerp(A[1],B[1],p);break}if(f>b[0])[x,y]=ev(b[1])}
 const vis=f>pts[0][0]-.02?1:0;ring.style.opacity=vis;ring.style.transform=`translate(${x}px,${y}px)`;
 let ro=0,rs=1,rx=0,ry=0;pts.forEach(p=>{if(p[2]){const q=(f-p[0])/.06;if(q>0&&q<1){ro=1-q;rs=1+q*2.4;[rx,ry]=ev(p[1])}}});
 ring.style.transform=`translate(${x}px,${y}px) scale(${1-(ro>0?.25*ro:0)})`;rip.style.opacity=ro;rip.style.transform=`translate(${rx}px,${ry}px) scale(${rs})`}

const ROWS=[
["Spring_Launch_UGC_01","Maya Chen","Filming","#7C5CFC","Dec 2","2d late","late","Maya","3h ago"],
["Unboxing_Reel_Hair_03","Jordan Reyes","Revision","#F59E3B","Today","due today","due","Jordan","5h ago"],
["Gift_Guide_Brkaway_02","Lia Park","Waiting on client","#3FE0A4","Dec 6","in 4 days","need","Tessa","1d ago"],
["Serum_Review_UGC_07","Sam Okafor","Contracting","#5CC8FF","Dec 4","in 2 days","need","Sam","2d ago"],
["Holiday_Haul_Spark_05","Ana Costa","Filming","#7C5CFC","Dec 1","3d late","late","Ana","4h ago"]];
const rowHTML=(r,cols)=>`<div class="row" data-g="${r[6]}" style="--c:${r[3]};grid-template-columns:${cols||"1.9fr 1.2fr 1fr"}"><div><div class="nm">${r[0]}</div><div class="cr">${r[1]}</div></div><div><span class="pill" style="--c:${r[3]}">${r[2]}</span></div><div class="dl" style="color:${r[6]==="late"?"var(--danger)":"var(--text)"}">${r[4]}<small>${r[5]}</small></div></div>`;

// ---------- scenes ----------
const SC=[];
const scene=(id,startLine,html,update)=>SC.push({id,startLine,html,update});

/* S1 */
scene("S1","s1a",
`<div id="grid" class="abs" style="left:-600px;right:-600px;top:560px;height:1400px;perspective:900px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%);mask-image:linear-gradient(to bottom,transparent,#000 30%)"><div id="gp" style="width:100%;height:100%;transform:rotateX(68deg);transform-origin:top;background-image:linear-gradient(rgba(124,92,252,.45) 2px,transparent 2px),linear-gradient(90deg,rgba(92,200,255,.35) 2px,transparent 2px);background-size:110px 110px"></div></div>
<div class="abs eb" id="e1" style="left:0;right:0;top:300px;text-align:center">Production board</div>
<div class="abs disp" id="a1" style="left:0;right:0;top:390px;text-align:center;font-weight:800;font-size:100px;letter-spacing:-.04em;line-height:1.1">${chars('Working on the <span class="gt">Production</span> board?')}</div>
<div class="abs disp" id="a2" style="left:0;right:0;top:390px;text-align:center;font-weight:800;font-size:124px;letter-spacing:-.04em;line-height:1.1">${chars('Which collabs need <span class="gt">you</span> today?')}</div>`,
(el,f,lt,d)=>{const sw=(L.s1b?L.s1b.start-.3:5)-SC[0].s;const A=$("#a1",el),B=$("#a2",el);
 $("#gp",el).style.backgroundPosition=`0 ${lt*90}px`;
 pop($("#e1",el),lt,0,.6,16);
 revealChars(A,lt,.1,1.1);A.style.opacity=1-r(lt,sw-.35,sw);A.style.transform=`scale(${1+r(lt,sw-.35,sw)*.06})`;
 const lb=lt-sw;B.style.visibility=lb>-.05?"visible":"hidden";revealChars(B,lb,.05,.9);});

/* S2 */
scene("S2","s2",
`<div id="tun" class="abs" style="inset:0;perspective:900px;perspective-origin:50% 50%"></div>
<div class="abs disp" id="t2" style="left:0;right:0;top:400px;text-align:center;font-weight:800;font-size:150px;letter-spacing:-.045em;line-height:1">
<span class="w" style="color:var(--danger);text-shadow:0 0 60px rgba(255,92,122,.7)">Late.</span> <span class="w" style="color:var(--gold);text-shadow:0 0 60px rgba(232,184,92,.7)">Due.</span> <span class="w" style="color:var(--crystal);text-shadow:0 0 60px rgba(92,200,255,.7)">Quiet.</span></div>`,
(el,f,lt,d)=>{const tun=$("#tun",el);
 if(!tun.children.length){const cols=["#7C5CFC","#F59E3B","#3FE0A4","#5CC8FF","#FF5C7A"];
  for(let i=0;i<22;i++){const e=document.createElement("div");e.className="row";const R=ROWS[i%5];e.style.cssText=`position:absolute;left:760px;top:420px;width:520px;--c:${cols[i%5]};grid-template-columns:1.6fr auto;opacity:0`;e.innerHTML=`<div><div class="nm">${R[0]}</div><div class="cr">${R[1]}</div></div><span class="pill" style="--c:${cols[(i+2)%5]}">${R[2]}</span>`;e.dataset.i=i;tun.appendChild(e)}}
 $$(".row",tun).forEach(e=>{const i=+e.dataset.i;const p=((lt*.26+i/22)%1);const ang=i*2.4;const rad=380+((i*137)%5)*160;const x=Math.cos(ang)*rad*p*1.5,y=Math.sin(ang)*rad*p*.9;const z=-1800+p*2300;
  e.style.transform=`translate3d(${x}px,${y}px,${z}px)`;e.style.opacity=Math.sin(p*Math.PI)*.8*r(lt,0,.6)});
 $$(".w",el).forEach((w,i)=>{const p=back((lt-.5-i*.62)/.5);w.style.display="inline-block";w.style.opacity=clamp(p*2);w.style.transform=`scale(${.7+.3*p}) translateY(${(1-p)*30}px)`});
 $("#t2",el).style.transform=`scale(${1+r(lt,3,6)*.04})`;});

/* S3 */
scene("S3","s3",
`<div id="rings" class="abs" style="left:960px;top:400px"></div>
<div id="lg" class="abs" style="left:0;right:0;top:250px;display:flex;justify-content:center;align-items:center;gap:36px"><div id="bolt" style="width:150px;height:150px;border-radius:44px;background:linear-gradient(135deg,var(--violet),var(--crystal));display:grid;place-items:center;box-shadow:0 0 90px rgba(124,92,252,.8)"><div style="width:84px;height:84px">${BOLT}</div></div><div class="disp" style="font-weight:800;font-size:132px;letter-spacing:-.045em">Collab Digest</div></div>
<div class="abs disp" id="tg" style="left:0;right:0;top:560px;text-align:center;font-weight:700;font-size:70px;letter-spacing:-.03em;line-height:1.2">${chars('The easiest way to see <span class="gt">what needs you.</span>')}</div>`,
(el,f,lt,d)=>{const lg=$("#lg",el);const p=back((lt-.1)/.8);lg.style.opacity=clamp(p*2);lg.style.transform=`scale(${.7+.3*p}) translateY(${lerp(120,0,eio((lt-1.4)/.9))}px)`;
 const rg=$("#rings",el);if(!rg.children.length){for(let i=0;i<3;i++){const e=document.createElement("div");e.style.cssText="position:absolute;left:-300px;top:-300px;width:600px;height:600px;border-radius:50%;border:3px solid rgba(124,92,252,.6)";rg.appendChild(e)}}
 $$("div",rg).forEach((e,i)=>{const q=((lt*.5+i/3)%1);e.style.transform=`scale(${.3+q*2.2})`;e.style.opacity=(1-q)*.6*r(lt,.1,.6)*(1-r(lt,2.2,3))});
 revealChars($("#tg",el),lt,1.6,2.8);});

/* S4 */
scene("S4","s4",
`<div class="abs eb" id="e4" style="left:0;right:0;top:110px;text-align:center">Set up once</div>
<div class="abs disp" id="h4" style="left:0;right:0;top:160px;text-align:center;font-weight:800;font-size:84px;letter-spacing:-.04em">${chars('Sign in. Paste a token. <span class="gt">Done.</span>')}</div>
<div id="st" class="abs" style="left:120px;right:120px;top:360px;display:flex;gap:40px;perspective:1600px"></div>`,
(el,f,lt,d)=>{pop($("#e4",el),f,0,.1,12);revealChars($("#h4",el),f,.04,.28);
 const st=$("#st",el);if(!st.children.length){st.innerHTML=[
 ["1","Sign in with Google","Company accounts only, limited to your Workspace domain.",`<div class="btn ghost" style="margin-top:26px;font-size:24px;gap:14px"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1C3.3 21.4 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C18 1.2 15.2 0 12 0 7.3 0 3.3 2.6 1.3 6.6l4 3.100c.9-2.900 3.600-4.900 6.700-4.900z"/></svg>Continue with Google</div>`],
 ["2","Paste your Monday token","Your own personal API token, saved once. It never reaches the page.",`<div class="mono" style="margin-top:26px;font-size:22px;padding:20px 22px;border-radius:14px;border:1px solid var(--line);background:rgba(7,10,22,.7);letter-spacing:.14em;color:var(--crystal)">eyJhbGciOi••••••••</div>`],
 ["3","Only your collabs","Just the ones where you are the CFS. Read-only.",`<div style="display:flex;gap:12px;margin-top:26px;flex-wrap:wrap"><span class="chip" style="--c:#7C5CFC"><i></i>Your CFS</span><span class="chip" style="--c:#3FE0A4"><i></i>Read-only</span></div>`]
 ].map(s=>`<div class="glass cd" style="flex:1;padding:44px;min-height:470px;position:relative"><div class="disp" style="font-weight:800;font-size:110px;line-height:1;opacity:.14;position:absolute;right:30px;top:20px">${s[0]}</div><div style="width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--violet),var(--crystal));display:grid;place-items:center;font:800 32px Sora;margin-bottom:34px;box-shadow:0 0 40px rgba(124,92,252,.6)">${s[0]}</div><div class="disp" style="font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.15">${s[1]}</div><div style="font-size:24px;color:var(--muted);margin-top:16px;line-height:1.45">${s[2]}</div>${s[3]}<div class="ck" style="position:absolute;right:30px;bottom:30px;width:56px;height:56px;border-radius:50%;background:var(--lume);color:#06281e;display:grid;place-items:center;font:800 30px Sora;box-shadow:0 0 40px rgba(63,224,164,.7);opacity:0">&#10003;</div></div>`).join("")}
 $$(".cd",st).forEach((c,i)=>{const p=r(f,.12+i*.13,.34+i*.13);c.style.opacity=p;c.style.transform=`translateY(${(1-p)*90}px) rotateY(${(1-p)*(i-1)*-24}deg)`;const k=$(".ck",c),q=back((f-(.55+i*.13))/.1);k.style.opacity=clamp(q*3);k.style.transform=`scale(${clamp(q,0,1.2)})`})});

/* S5 */
scene("S5","s5",
`<div class="abs eb" id="e5" style="left:130px;top:150px">/digest</div>
<div class="abs disp" id="h5" style="left:130px;top:200px;width:760px;font-weight:800;font-size:68px;letter-spacing:-.04em;line-height:1.08">${chars('What needs <span class="gt">you</span> on Production?')}</div>
<div id="tiles" class="abs" style="left:130px;top:440px;width:760px;display:flex;flex-direction:column;gap:18px"></div>

 revealChars($("#t12",el),lt,.1,1.3);$("#st12",el).style.width=(r(lt,1.6,2.1)*104)+"%";$("#scr",el).style.opacity=1-.55*r(lt,1.7,2.2)});

 const rg=$("#rings13",el);if(!rg.children.length){for(let i=0;i<3;i++){const e=document.createElement("div");e.style.cssText="position:absolute;left:-300px;top:-300px;width:600px;height:600px;border-radius:50%;border:3px solid rgba(92,200,255,.5)";rg.appendChild(e)}}

// ---------- timeline ----------
SC.forEach((s,i)=>{s.s=i===0?0:(L[s.startLine]?L[s.startLine].start-.3:i*5)});
SC.forEach((s,i)=>{s.e=i<SC.length-1?SC[i+1].s+.4:T});

stage.appendChild(rip);stage.appendChild(ring);
const cap=document.createElement("div");cap.id="cap";cap.innerHTML='<div id="capin"></div>';stage.appendChild(cap);const capin=$("#capin");

// captions
const CH=[];
TL.lines.forEach(l=>{let cur=[];l.words.forEach((w,i)=>{cur.push(w);const end=/[.?!,]$/.test(w.w);if((end&&cur.length>=3)||cur.length>=7||i===l.words.length-1){CH.push({words:cur,t0:cur[0].t0,t1:cur[cur.length-1].t1});cur=[]}})});

function captions(t){let idx=-1;for(let i=0;i<CH.length;i++){const nt=i<CH.length-1?CH[i+1].t0:1e9;if(t>=CH[i].t0-.08&&t<Math.min(CH[i].t1+.25,nt))idx=i}

 cap.style.opacity=idx<0?0:1;
 if(idx>=0)$$(".cw",capin).forEach((e,i)=>{const w=CH[idx].words[i];e.className="cw"+(t>=w.t1?" done":t>=w.t0?" on":"")})}

window.TOTAL=T;
window.render=function(t){
 moveBg(t);ring.style.opacity=0;rip.style.opacity=0;
 SC.forEach(s=>{const vis=t>=s.s&&t<s.e;s.el.style.visibility=vis?"visible":"hidden";if(!vis){s.el.style.opacity=0;return}
  const lt=t-s.s,dd=s.e-s.s,f=lt/dd;const fi=ease(lt/.4),fo=ease((s.e-t)/.35);
  s.el.style.opacity=Math.min(fi,fo);s.el.style.transform=`translateY(${(1-fi)*30}px) scale(${1+(1-fo)*.03})`;
  s.update(s.el,f,lt,dd)});
 captions(t)};
render(0);
