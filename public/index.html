<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collab Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/shell.css">
</head>
<body data-page="home" data-crumb="Home" data-auth="required">
<div class="shell" id="app" hidden>
<aside class="side"></aside>
<div class="main">
<header class="topbar"></header>
<main class="content">
<div class="wrap">
  <section class="hero">
    <span class="eyebrow">ContentJet · Creative fulfillment</span>
    <h1 class="hero-title">Collab<br>Status<br><em>Digest</em></h1>
    <p class="hero-sub">See what needs you, track your week and message creators, all in one place.</p>
    <div class="hero-actions">
      <a class="btn primary" href="/digest">Open my collabs <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
      <a class="btn" href="/kpi">Weekly KPIs</a>
      <a class="btn" href="/guide">Guide</a>
    </div>
    <p class="hero-note"><i></i><span>Collab Digest reads the Monday.com Production board and never changes it. You message creators yourself; it only drafts the words.</span></p>
  </section>
</div>
</main>
</div>
</div>
<script src="/shell.js"></script>
<script>
(async()=>{
  const cfg=await Shell.config;
  const qs=new URLSearchParams(location.search),authErr=qs.get("auth_error");
  if(authErr)history.replaceState(null,"",location.pathname);
  const AUTH_ERR={denied:"Google sign-in was cancelled.",state:"Sign-in took too long. Try again.",exchange:"Google sign-in failed. Try again.",
    wrong_domain:"Use your company Google account. Personal Gmail accounts can't sign in.",not_configured:"Sign-in isn't set up yet."};
  if(cfg.signedIn){document.getElementById("app").hidden=false;return}
  let msg=authErr?(AUTH_ERR[authErr]||"Sign-in failed."):"";
  if(cfg.missing&&cfg.missing.length)msg=msg||"Sign-in isn't set up yet. Missing in Vercel: "+cfg.missing.join(", ")+".";
  const err=document.getElementById("gateErr");err.textContent=msg;err.hidden=!msg;
  document.getElementById("gate").hidden=false;
})();
</script>
</body>
</html>
